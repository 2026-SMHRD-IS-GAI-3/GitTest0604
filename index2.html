<body>
    <h1>Push&Pull 실습</h1>
    <p>팀원 2명은 서로 다른 내용 작성해주세요~!</p>
    <p>작성하셨으면 아래 명령어 수행해주세요.</p>
    <p>git add . </p>
    <p>git commit -m "메시지입력"</p>
    <p>둘 중에 한분이 먼저 Push 진행하기!</p>
    <p>Push완료되면 다른 한햐분은 Pull하기!</p>
    <p>충돌해결 이후에는 git commit 명령어 실행!(로컬저장소 업데이트)</p>
    <p>다시 git push 실행</p>
</body>
</html>
